<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmileCraft | Appointment Admin</title><style>body{font-family:system-ui;background:#f3f8fb;color:#173b61;margin:0;padding:32px}main{max-width:1100px;margin:auto}input,button,select{padding:12px;border:1px solid #c7d8e6;border-radius:8px}button{background:#173b61;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;background:white;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #dce6ee;text-align:left;vertical-align:top}th{background:#e6f1f7}.scroll{overflow:auto}#message{margin:16px 0}</style><main><h1>SmileCraft Appointment Requests</h1><p>Enter the administrator token configured on your server. This dashboard displays submitted contact information; restrict access to authorized clinic staff.</p><input id="token" type="password" placeholder="Admin token" aria-label="Admin token"><button id="load">Load requests</button><p id="message" role="status"></p><div class="scroll"><table><thead><tr><th>Received</th><th>Patient</th><th>Contact</th><th>Service</th><th>Preferred</th><th>Message</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=document.getElementById('token'),rows=document.getElementById('rows'),message=document.getElementById('message');async function load(){message.textContent='Loading…';try{let r=await fetch('/api/appointments',{headers:{Authorization:'Bearer '+token.value}}),d=await r.json();if(!r.ok)throw Error(d.error);rows.replaceChildren();for(const a of d.appointments){const tr=document.createElement('tr');for(const val of [a.created_at,a.name,a.phone+' / '+a.email,a.service,a.date+' / '+a.time,a.message]){const td=document.createElement('td');td.textContent=val||'—';tr.append(td)}const td=document.createElement('td'),select=document.createElement('select');for(const status of ['pending','confirmed','completed','cancelled']){const opt=document.createElement('option');opt.value=opt.textContent=status;opt.selected=status===a.status;select.append(opt)}select.addEventListener('change',async()=>{const r=await fetch('/api/appointments/'+a.id,{method:'PATCH',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});message.textContent=r.ok?'Status updated':'Update failed'});td.append(select);tr.append(td);rows.append(tr)}message.textContent=d.appointments.length+' requests loaded'}catch(e){message.textContent='Error: '+e.message}}document.getElementById('load').onclick=load;</script></html>
